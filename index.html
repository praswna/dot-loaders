<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dot-loaders</title>
<meta name="description" content="점으로 만든 대기 애니메이션 모음. 변형을 연구하고, 다른 프로젝트에서 가져다 쓴다.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf9f5; --card: #ffffff; --text: #1f1e1d; --muted: #6b675f; --line: #e6e2d8;
    --accent: #d97757; --btn: #f1efe8; --btn-hover: #e8e5dc;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  :root[data-theme="dark"] {
    --bg: #1f1e1d; --card: #2a2927; --text: #ece9e1; --muted: #9a958a; --line: #3b3936;
    --btn: #373532; --btn-hover: #44413d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, "Pretendard", "Malgun Gothic", sans-serif;
    padding: 0 16px 80px;
  }
  button {
    font: inherit; color: var(--text); background: var(--btn); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { background: var(--btn-hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .notice label { white-space: nowrap; margin-left: 4px; }
  .notice {
    max-width: 1120px; margin: 14px auto 0; padding: 10px 14px; border-radius: 10px; font-size: 13px;
    background: color-mix(in srgb, var(--accent) 12%, var(--card)); border: 1px solid var(--accent); color: var(--text);
  }
  .chips { max-width: 1120px; margin: 24px auto 0; display: flex; flex-direction: column; gap: 6px; }
  .chip-row { position: relative; }
  .chip-scroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
  .chip-scroll::-webkit-scrollbar { display: none; }
  .chip-scroll button { flex: none; white-space: nowrap; }
  .chip-row .chip-more {
    position: absolute; right: 0; top: 0; bottom: 0; display: none; align-items: center; padding: 0 4px 0 22px;
    border: 0; border-radius: 0; font-size: 18px; color: var(--text);
    background: linear-gradient(to right, transparent, var(--bg) 45%);
  }
  .chip-row.more .chip-more { display: flex; }
  .chips .n { margin-left: 5px; font-size: 11px; opacity: .6; }
  .chips .top button { border-radius: 999px; padding: 6px 14px; font-size: 14px; }
  .chips .top button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); font-weight: 600; }
  .chips .sub button { background: none; border: 1.5px solid transparent; border-radius: 6px; padding: 2px 8px; color: var(--muted); font-size: 13px; }
  .chips .sub button:hover { color: var(--text); }
  .chips .sub button[aria-pressed="true"] { border-color: var(--accent); color: var(--text); font-weight: 600; }
  .card[hidden] { display: none; }
  .group { max-width: 1120px; margin: 26px auto 0; }
  .group[hidden] { display: none; }
  .group > header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 0; margin: 0; max-width: none; }
  .group > header h2 { font-size: 17px; margin: 0; }
  .group > header p { margin: 0; color: var(--muted); font-size: 13px; }
  .group > header button { margin-left: auto; font-size: 12px; padding: 3px 10px; }
  .group .grid { margin-top: 10px; }
  .archive { max-width: 1120px; margin: 36px auto 0; border-top: 1px dashed var(--line); padding-top: 14px; }
  .archive summary { cursor: pointer; font-size: 17px; font-weight: 600; }
  .archive summary .n { font: 12px var(--mono); color: var(--muted); margin-left: 6px; font-weight: 400; }
  .archive.empty summary { color: var(--muted); }
  .archive .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  .archive .hint code { font: 12px var(--mono); }
  .archive .grid { margin-top: 12px; }
  .card.archived { opacity: .72; }
  .card.archived:hover { opacity: 1; }
  .grid {
    max-width: 1120px; margin: 18px auto 0;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .card .stage {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    height: 150px; border-radius: 10px; background: var(--bg);
    background-image: radial-gradient(var(--line) 0.6px, transparent 0.6px); background-size: 12px 12px;
  }
  .card .stage canvas { display: block; }
  .card .stage .mini { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 11px; }
  .card h2 { font-size: 15px; margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card h2 code { font: 12px var(--mono); color: var(--muted); font-weight: 400; }
  .card p { margin: 0; color: var(--muted); font-size: 13px; min-height: 2.6em; }
  .card .meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .card .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
  .card .actions button { padding: 4px 9px; font-size: 13px; }
  .state { font: 11px var(--mono); color: var(--muted); margin-left: auto; align-self: center; }
  footer {
    position: fixed; right: 12px; bottom: 8px; font: 11px var(--mono); color: var(--muted); opacity: .75;
  }
  footer a { color: inherit; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  .toast {
    position: fixed; left: 50%; bottom: 68px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .card.in-cart { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .card.in-cart .cart-btn { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cart { position: fixed; left: 16px; bottom: 16px; z-index: 10; display: flex; flex-direction: column-reverse; align-items: flex-start; gap: 8px; }
  .cart-toggle { border-radius: 999px; padding: 7px 14px; box-shadow: 0 2px 10px rgb(0 0 0 / .15); background: var(--card); }
  .cart:not(.empty) .cart-toggle { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cart-toggle .n { font: 12px var(--mono); margin-left: 4px; }
  .cart-panel {
    width: min(400px, calc(100vw - 32px)); max-height: min(72vh, 640px); overflow: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; box-shadow: 0 6px 24px rgb(0 0 0 / .18);
    display: flex; flex-direction: column; gap: 10px;
  }
  .cart-panel[hidden] { display: none; }
  .cart-head { display: flex; align-items: baseline; gap: 8px; }
  .cart-head span { color: var(--muted); font-size: 12px; }
  .cart-head button { margin-left: auto; padding: 0 8px; }
  .cart-stage {
    display: flex; align-items: center; justify-content: center; height: 120px; border-radius: 10px; background: var(--bg);
    background-image: radial-gradient(var(--line) 0.6px, transparent 0.6px); background-size: 12px 12px;
  }
  .cart.empty .cart-stage { display: none; }
  .cart-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .cart-list li { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .cart-list li code { font: 12px var(--mono); color: var(--accent); }
  .cart-list li span { color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cart-list li button { padding: 0 7px; font-size: 13px; }
  .cart-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .cart-actions button { font-size: 13px; padding: 4px 9px; }
  .cart details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .cart pre { margin: 6px 0 0; padding: 10px; background: var(--bg); border-radius: 8px; font: 11px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<p class="notice" id="motionNotice" hidden>OS 의 <b>모션 축소</b>(Windows: 설정 → 접근성 → 시각 효과 → 애니메이션 효과) 가 켜져 있어 정지 화면만 보입니다. <label><input id="motion" type="checkbox"> 이 페이지에서만 무시하고 움직이기</label></p>

<nav class="chips" aria-label="카테고리">
  <div class="chip-row top"><div class="chip-scroll" id="chips"></div><button class="chip-more" aria-label="카테고리 더 보기" tabindex="-1">›</button></div>
  <div class="chip-row sub"><div class="chip-scroll" id="subChips" aria-label="배치"></div><button class="chip-more" aria-label="배치 더 보기" tabindex="-1">›</button></div>
</nav>

<main id="groups"></main>

<details class="archive" id="archiveBox">
  <summary>보관함 <span class="n" id="archiveCount">0</span></summary>
  <p class="hint" id="archiveHint"></p>
  <div class="grid" id="archiveGrid"></div>
</details>

<aside class="cart empty" id="cart">
  <button class="cart-toggle" id="cartToggle" aria-expanded="false" aria-controls="cartPanel">🛒 장바구니<span class="n" id="cartCount">0</span></button>
  <div class="cart-panel" id="cartPanel" hidden>
    <div class="cart-head"><b>장바구니</b><span>고른 것만 다른 프로젝트로 넘기기</span><button id="cartClose" title="닫기">×</button></div>
    <div class="cart-stage"><div id="cartStage"></div></div>
    <ul class="cart-list" id="cartList"></ul>
    <div class="cart-actions">
      <button class="primary" data-cart="handoff" title="변형 목록·미리 보기 링크·코드·필요한 파일·굽기 명령을 한 글로">전달문 복사</button>
      <button data-cart="code" title="고른 변형만 import 하는 mount 코드">코드만 복사</button>
      <button data-cart="link" title="이 장바구니를 담은 갤러리 링크">링크 복사</button>
      <button data-cart="bake" title="고른 변형의 PNG 시트 + json 을 모두 내려받기">PNG 시트 모두</button>
      <button data-cart="clear">비우기</button>
    </div>
    <details><summary>전달문 미리 보기</summary><pre id="cartPreview"></pre></details>
  </div>
</aside>

<footer id="version">dev</footer>
<div class="toast" id="toast"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
